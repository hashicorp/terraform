syntax = "proto3";

package proto;

option go_package = "github.com/hashicorp/terraform-policy-plugin/proto";

import "diagnostics.proto";
import "policy.proto";
import "types.proto";

service CallbackService {
  rpc GetResources(GetResourcesRequest) returns (GetResourcesResponse);
  rpc GetDataSource(GetDataSourceRequest) returns (GetDataSourceResponse);
  rpc GetResourcesByIdentifier(GetResourcesByIdentifierRequest) returns (GetResourcesByIdentifierResponse);
}

message GetResourcesRequest {
  string type = 1;
  bytes attributes = 2;
  // evaluation_request_id is the ID of the policy evaluation request that is
  // making this callback request.
  uint32 evaluation_request_id = 3;
}

message GetResourcesResponse {
  repeated bytes results = 1;                // as today, unless the plugin accepts identifiers
  // partial means that the request encountered unknown objects during evaluation,
  // and the results may be incomplete.
  bool partial = 2;
  repeated string identifiers = 3;           // instead of results, when the plugin accepts identifiers
}

message GetDataSourceRequest {
  string type = 1;
  bytes config = 2;
  // evaluation_request_id is the ID of the policy evaluation request that is
  // making this callback request.
  uint32 evaluation_request_id = 3;
}

message GetDataSourceResponse {
  bytes result = 1;
  // deferred indicates that the data source read was deferred during evaluation.
  bool deferred = 2;
}

message GetResourcesByIdentifierRequest {
  // The evaluation_id of the EvaluateResource being served.
  uint32 evaluation_request_id = 1;
  repeated string identifiers = 2;
}

message GetResourcesByIdentifierResponse {
  repeated Resource resources = 1;           // one per requested identifier, in request order
  repeated Diagnostic diagnostics = 2;

  message Resource {
    string identifier = 1;
    string type = 2;                         // e.g. aws_lb_listener
    PolicyEvaluateResourceRequest.ResourceMetadata metadata = 3;
    ResourceAttributes attrs = 4;            // absent for DELETE
    ResourceAttributes prior_attrs = 5;      // absent for CREATE
  }
}
