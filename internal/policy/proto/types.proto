syntax = "proto3";

package proto;

option go_package = "github.com/hashicorp/terraform-policy-plugin/proto";

// EvaluateResult contains a single value for the overall result of the evaluate
// RPC. This allows users to differentiate between different types of
// diagnostics.
enum EvaluateResult {
  // INVALID means the result that was set by the server wasn't recognized by
  // the client. This means a future version of Terraform Policy has introduced
  // a new result type, and the client isn't aware of this. Clients should
  // handle this gracefully.
  INVALID_EVALUATE_RESULT = 0;

  // UNKNOWN means the result could not be verified at this time. This means
  // the client sent unknown values to the server as part of the request, and
  // within Terraform means the request happened at plan time. The
  // diagnostics will contain only warnings explaning which policies could
  // not be evaluated.
  UNKNOWN_EVALUATE_RESULT = 1;

  // ERROR means the policy files themselves were invalid in some way, and so
  // the policies could not be evaluated. This would cover things like
  // invalid references or invalid syntax. The diagnostics will contain
  // errors explaining exactly what went wrong.
  ERROR_EVALUATE_RESULT = 2;

  // ALLOW means the resource passed all relevant policies. The diagnostics
  // will not contain any errors, but might contain warnings.
  ALLOW_EVALUATE_RESULT = 3;

  // DENY means the resource failed at least one relevant policy. The
  // diagnostics will contain exact explanations as to why and should be
  // displayed to the user.
  DENY_EVALUATE_RESULT = 4;

  // SETUP_ERROR means the policy engine failed to set up properly. This
  // could be due to a missing or invalid configuration file, or a problem
  // with the policy engine itself. The diagnostics will contain errors
  // explaining exactly what went wrong.
  SETUP_ERROR_EVALUATE_RESULT = 5;
}

// Operation represents the Terraform operation being performed on a resource.
enum Operation {
  CREATE = 0;
  UPDATE = 1;
  DELETE = 2;
  NO_OP = 3;
}

message ResourceAttributes {
  bytes raw = 1;
  repeated AttributePath redacted_paths = 2; 
}

// AttributePath represents a set of steps to traverse into a data structure. It is
// used to refer to a sub-structure within a dynamic data structure presented
// separately.
message AttributePath {
    message Step {
        oneof selector {
            // Set "attribute_name" to represent looking up an attribute
            // in the current object value.
            string attribute_name = 1;

            // Set "element_key_*" to represent looking up an element in
            // an indexable collection type.
            string element_key_string = 2;
            int64 element_key_int = 3;
        }
    }
    repeated Step steps = 1;
}

enum EvaluationStage {
    INVALID_EVALUATION_STAGE = 0;
    INIT_EVALUATION_STAGE = 1;
    PLAN_EVALUATION_STAGE = 2;
    APPLY_EVALUATION_STAGE = 3;
    QUERY_EVALUATION_STAGE = 4;
}

// PlanMode is the mode of the plan that a relationship run belongs to.
enum PlanMode {
  INVALID_PLAN_MODE = 0;
  NORMAL_PLAN_MODE = 1;
  DESTROY_PLAN_MODE = 2;
  REFRESH_ONLY_PLAN_MODE = 3;
}

// RunRuntime is the runtime that started a relationship run.
enum RunRuntime {
  INVALID_RUN_RUNTIME = 0;
  CLI_RUN_RUNTIME = 1;
  TEST_RUN_RUNTIME = 2;     // not sent in P1
  STACKS_RUN_RUNTIME = 3;   // not sent in P1
}

// Terraform's plans.Action for a managed resource instance, verbatim.
// (Read, Open, Renew, Close never occur for managed resources and have no value.)
enum ResourceAction {
  INVALID_RESOURCE_ACTION = 0;
  NO_OP_RESOURCE_ACTION = 1;
  CREATE_RESOURCE_ACTION = 2;
  UPDATE_RESOURCE_ACTION = 3;
  DELETE_RESOURCE_ACTION = 4;
  DELETE_THEN_CREATE_RESOURCE_ACTION = 5;
  CREATE_THEN_DELETE_RESOURCE_ACTION = 6;
  FORGET_RESOURCE_ACTION = 7;
  CREATE_THEN_FORGET_RESOURCE_ACTION = 8;
  FORGET_THEN_CREATE_RESOURCE_ACTION = 9;
}

// RecordSource says where an instance record of a relationship run came from.
enum RecordSource {
  INVALID_RECORD_SOURCE = 0;
  PLANNED_RECORD_SOURCE = 1;     // from a planned change (plan run) or an applied change (apply run)
  STATE_RECORD_SOURCE = 2;       // from state, without a change in this run (-target outsiders, refresh-only)
  DEFERRED_RECORD_SOURCE = 3;    // P2, not sent in P1
  DISCOVERED_RECORD_SOURCE = 4;  // P6 (Search), not sent in P1
}

// TypeCompleteness says whether every instance of a resource type has been
// reported in a relationship run.
enum TypeCompleteness {
  INVALID_TYPE_COMPLETENESS = 0;
  COMPLETE_TYPE_COMPLETENESS = 1;
  INCOMPLETE_DEFERRED_TYPE_COMPLETENESS = 2;
  INCOMPLETE_ERROR_TYPE_COMPLETENESS = 3;
}

message AttributePaths {
  repeated AttributePath paths = 1;
}
